<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forkout · Meal ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<script>try{var q=/[?&]theme=(light|dark)/.exec(location.search),t=q?q[1]:localStorage.getItem('fk-look');if(!t)t='dark';if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='light')document.documentElement.dataset.fk='light'}catch(e){}</script>
<style>.canvas#canvas{height:1700px;min-height:1700px!important}</style>
</head>
<body data-tab="food" data-title="Meal ideas" data-note="72 meal ideas (including pre-gym carb meals) with ingredient amounts, steps and macros. Filter by meal and style, or show only meals that fit what you have left today.">
<div class="stage">
  <div class="device">
    <div class="app" id="app">
      <div class="scroll"><div class="canvas v5" id="canvas">
        <div class="top in" style="--i:0;justify-content:flex-start"><a class="ibtn press" href="food.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="ttl" style="margin:0 0 0 22px">Meal ideas</h1></div>
        <section class="c left5 in" style="--i:1"><div><span class="k">Left today</span><b class="num" id="lk">958<small>kcal</small></b><span class="lp"><b id="lp">38g</b> protein to go</span></div><button class="fitbtn press" id="fit" aria-pressed="false">Fits what's left</button></section>
        <div class="tabs5 in" style="--i:2" id="types"><button aria-pressed="true">All</button><button aria-pressed="false">Breakfast</button><button aria-pressed="false">Lunch</button><button aria-pressed="false">Dinner</button><button aria-pressed="false">Snack</button><button aria-pressed="false">Pre-gym</button></div>
        <div class="chips5 in" style="--i:2;margin-top:18px" id="tags"></div>
        <div class="k in" style="--i:3;margin:30px 6px 0" id="count"></div>
        <div class="mlist in" style="--i:3" id="mlist"></div>
      </div></div>
      <div class="layer top" id="topLayer"></div>
      <div class="layer bottom" id="bottomLayer"></div>
    </div>
  </div>
  <aside class="panel"></aside>
</div>
<script src="js/meals.js"></script>
<script src="js/plan.js"></script>
<script src="js/fk.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/workouts.js"></script>
<script src="js/sync.js"></script>
<script>
(function () {
  var $ = FK.$;
  var M = window.FKMEALS || [], typ = 'All', tag = '', fit = false, LEFT = 958;
  var BD = {p: '<svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="6.200" fill="currentColor"/><path d="M10.600 13.400 5.200 18.800" stroke-width="2.600"/><circle cx="4.200" cy="17.400" r="1.900" fill="currentColor" stroke="none"/><circle cx="6.600" cy="19.800" r="1.900" fill="currentColor" stroke="none"/></g></svg>', c: '<svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.500V9" stroke-width="2"/><path d="M12 2c1.700 1.600 2.200 3.200 0 5.500C9.800 5.200 10.300 3.600 12 2z" fill="currentColor" stroke="none"/><path d="M12 9.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 9.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/><path d="M12 15c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 15c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/><path d="M12 20.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 20.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/></g></svg>', f: '<svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.600c3 0 4.600 3.200 4.600 6.200 0 1.600 1 2.800 1.900 4.300 1.600 2.700.8 5.200-1.300 6.700-1.600 1.200-3.300 1.700-5.200 1.700s-3.600-.5-5.200-1.700c-2.100-1.500-2.900-4-1.300-6.700.9-1.500 1.900-2.700 1.900-4.300 0-3 1.600-6.200 4.600-6.200z" stroke-width="2"/><circle cx="12" cy="15" r="3.200" fill="currentColor" stroke="none"/></g></svg>'};
  var FL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c1.2 4.2 5.8 5.6 5.8 11a5.8 5.8 0 0 1-11.6 0c0-3.4 2.2-4.6 2.3-7 1 1.2 2.1 2.2 3.300 2.300-.4-2.200-.6-4.300.2-6.300z"/></svg>', CK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var TAGS = ['High Protein', 'Quick to Make', 'Cheap & Easy', 'Healthy & Filling', 'Big Flavour', 'Something Different', 'Vegetarian'];
  $('tags').innerHTML = TAGS.map(function (t) { return '<button aria-pressed="false">' + t + '</button>'; }).join('');
  function mac(m) { return '<div class="mm"><span class="p">' + BD.p + m.p + 'g</span><span class="cc">' + BD.c + m.c + 'g</span><span class="f">' + BD.f + m.f + 'g</span></div>'; }
  function render() {
    var L = M.filter(function (m) { return (typ === 'All' || m.type === typ) && (!tag || (tag === 'Vegetarian' ? m.veg : m.tags.indexOf(tag) > -1)) && (!fit || m.kcal <= LEFT); });
    if (fit) L.sort(function (a, b) { return b.p - a.p; });
    $('count').textContent = L.length + (L.length === 1 ? ' meal' : ' meals');
    $('mlist').innerHTML = L.length ? L.map(function (m) { return '<button class="mi5 press" data-id="' + m.id + '"><div class="mtop"><b>' + m.name + '</b><span class="mtime">' + CK + m.mins + ' min</span></div><div class="mty">' + m.type + (m.veg ? ' · Vegetarian' : '') + '</div><div class="mrow"><div class="mk num">' + FL + m.kcal + '<small>kcal</small></div>' + mac(m) + '</div></button>'; }).join('') : '<div class="nothing">No meals match. Try another filter.</div>';
    var cv = $('canvas'); var h = Math.max(1700, $('mlist').offsetTop + $('mlist').offsetHeight + 260); cv.style.height = cv.style.minHeight = h + 'px';
  }
  function grp(id, cb) { $(id).addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var on = b.getAttribute('aria-pressed') !== 'true'; if (id === 'types') on = true; $(id).querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b && on)); }); cb(on ? b.textContent : ''); render(); }); }
  grp('types', function (v) { typ = v || 'All'; });
  grp('tags', function (v) { tag = v; });
  $('fit').onclick = function () { fit = !fit; $('fit').setAttribute('aria-pressed', String(fit)); render(); };
  var sh = document.createElement('div'); sh.className = 'msheet v5'; sh.hidden = true; $('bottomLayer').appendChild(sh);
  $('mlist').addEventListener('click', function (e) {
    var b = e.target.closest('.mi5'); if (!b) return; var m = M.filter(function (x) { return x.id === +b.dataset.id; })[0];
    sh.innerHTML = '<div class="msb"><div class="handle"></div><div class="mtop"><span class="k">' + m.type + ' · ' + m.mins + ' min</span><button class="x press" aria-label="Close">✕</button></div><h2>' + m.name + '</h2><div class="tg">' + m.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>' +
      '<div class="mrow" style="margin-top:26px"><div class="mk num">' + FL + m.kcal + '<small>kcal</small></div>' + mac(m) + '</div>' +
      '<h3>Ingredients <small>1 serve</small></h3><ul>' + m.ing.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
      '<h3>Method</h3><ol>' + m.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
      '<button class="btn wide press" id="logIt">Log this meal</button></div>';
    sh.hidden = false;
    sh.querySelector('.x').onclick = function () { sh.hidden = true; };
    sh.querySelector('#logIt').onclick = function () { sh.hidden = true; var n = FKPlan.logMeal(); FK.toast(m.name + ' logged · ' + n + ' day streak'); };
  });
  sh.addEventListener('click', function (e) { if (e.target === sh) sh.hidden = true; });
  if (location.hash === '#pregym') { var pb = $('types').querySelectorAll('button')[5]; $('types').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === pb)); }); typ = 'Pre-gym'; }
  render();
  FK.ready();
})();
</script>
</body>
</html>
