.left{margin-top:40px;padding:36px}
.left .big{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1}

.left p{margin:12px 0 0;font-size:24px;color:var(--muted)}
.left p b{color:var(--protein);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;margin:34px 0 8px;background:linear-gradient(90deg,var(--mint) var(--p,69%),var(--x-29323b) var(--p,69%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:var(--x-ffffff);border:6px solid var(--acc);box-shadow:0 0 20px color-mix(in srgb,var(--acc) 60%,transparent)}
input[type=range]::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--x-ffffff);border:6px solid var(--acc)}
.scale{display:flex;justify-content:space-between;font-size:19px;color:var(--dim)}
.asks{margin-top:28px}
.chat{display:flex;flex-direction:column;gap:20px;margin-top:34px}
.bub b{font-weight:700}
.mealc{border-radius:40px;overflow:hidden;animation:fkin .55s var(--ease) both}
.mealc .ph{position:relative;height:360px;overflow:hidden}
.mealc .ph img{width:100%;height:100%;object-fit:cover}
.mealc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.35))}
.mealc .ph .time{position:absolute;left:24px;top:24px;z-index:1;padding:10px 18px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;font-weight:600;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mealc .ph .fit{position:absolute;right:24px;top:24px;z-index:1;padding:10px 18px;border-radius:20px;background:var(--acc);color:var(--on-acc);font-size:20px;font-weight:700}
.mealc .bd{padding:30px 30px 26px}
.mealc .hd{display:flex;align-items:center;gap:22px}
.mealc .tile{flex:none;width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.mealc .tile svg{width:48px;height:48px}
.mealc h3{margin:0;font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.mealc .meta{margin-top:6px;font-size:21px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.pills span{padding:10px 18px;border-radius:20px;background:rgba(var(--ink),.06);font-size:21px;font-weight:600}
.ing{margin-top:18px;font-size:22px;color:var(--muted);line-height:1.45}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.mbtns .btn{height:80px;padding:0 20px;font-size:24px}
.another{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;height:56px;font-size:22px;font-weight:600;color:var(--muted)}
.another svg{width:24px;height:24px}
/* Recipe */
.recipe{padding:32px;animation:fkin .5s var(--ease) both}
.recipe .rhd{display:flex;align-items:center;justify-content:space-between}
.recipe h4{margin:14px 0 0;font-size:32px;font-weight:700;letter-spacing:-.3px}
.rmeta{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.rmeta span{padding:10px 18px;border-radius:20px;background:rgba(var(--ink),.06);font-size:20px;font-weight:600;color:var(--fg2)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:22px}
.rings div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:22px}
.rings div b{font-weight:600;color:var(--muted);white-space:nowrap}
.rsteps{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.rs{display:flex;gap:20px;align-items:flex-start;padding:22px 24px;border-radius:28px;background:rgba(var(--ink),.035);border:1px solid var(--line);font-size:23px;line-height:1.45;color:var(--fg2);
  opacity:0;transform:translateY(16px);transition:opacity .45s,transform .5s var(--ease)}
.rs.on{opacity:1;transform:none}
.rs>b{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);font-size:22px}
.rs .tm{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:48px;padding:0 18px;border-radius:24px;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc);font-size:20px;font-weight:700}
.rs .tm svg{width:22px;height:22px}
/* Grocery plan */
.gro{margin-top:60px;padding:36px}
.gro .tot{display:flex;align-items:baseline;gap:14px;margin-top:20px}
.gro .tot b{font-size:72px;font-weight:700;color:var(--mint);letter-spacing:-1.5px}
.gro .tot span{font-size:24px;color:var(--muted)}
.cat{margin-top:34px;font-size:19px;letter-spacing:3.6px;color:var(--muted);text-transform:uppercase}
.gi{display:flex;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);font-size:24px;cursor:pointer}
.gi .tick{width:52px;height:52px;border-radius:16px}
.gi .tick svg{width:24px;height:24px}
.gi span{flex:1}
.gi small{color:var(--muted);margin-left:10px}
.gi b{font-weight:600}
.gi.got span{text-decoration:line-through;color:var(--dim)}
.gro .btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
</style>

  var BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 6.5 0 0 1-18 0z"/><path d="M6.5 12c.5-2 2-3 3.5-3M12 12c0-2.5 1.5-3.8 3.5-4M8.5 7.5l1-2.5M14 6l1.5-2"/></svg>';

      '<button class="another" data-act="again">' + AGAIN + 'Something else</button></div>');
    el.querySelector('[data-act=add]').onclick = function () { this.textContent = 'Added ✓'; this.disabled = true; FK.burst(512, 1500); toast(m.n + ' added to dinner'); };
    el.querySelector('[data-act=how]').onclick = function () { this.disabled = true; this.style.opacity = .5; recipe(m); };
    el.querySelector('[data-act=again]').onclick = function () { ask('Something else?', kc, Q); };
    if (!window.addDinner) window.addDinner = function () { el.querySelector('[data-act=add]').click(); };
    return el;
  }
  // Step-by-step recipe, written out by the AI
  function recipe(m) {
    addBubble('bub me', 'How do I make it?');
    aiSays('Here\'s how. About <b>' + m.t + ' minutes</b>, one pan where it can be.', function () {
      var el = addBubble('card recipe', '<div class="rhd"><span class="lbl acc">Recipe · ' + (Math.abs(m.x - 1) < .05 ? '1 serve' : 'sized to fit') + '</span><span class="lbl">' + m.k + ' kcal</span></div><h4>' + m.n + '</h4>' +
        '<div class="rmeta"><span>⏱ ' + m.t + ' min</span><span style="color:var(--protein)">' + m.p + 'g protein</span>' + (m.cost ? '<span>about ' + m.cost + '</span>' : '') + '</div>' +
        '<div class="rings">' + m.r.map(function (x) { return '<div><span>' + x[0] + '</span><b>' + x[1] + '</b></div>'; }).join('') + '</div>' +
        '<div class="rsteps">' + m.s.map(function (x, i) { return '<div class="rs"><b>' + (i + 1) + '</b><div>' + x[0] + (x[1] ? '<br><button class="tm" data-min="' + x[1] + '">' + CLOCK + x[1] + ' min timer</button>' : '') + '</div></div>'; }).join('') + '</div>');
      el.querySelectorAll('.rs').forEach(function (r, i) { setTimeout(function () { r.classList.add('on'); }, FK.reduce ? 0 : 250 + i * 260); });
      el.querySelectorAll('.tm').forEach(function (b) { b.onclick = function () { toast('Timer set: ' + b.dataset.min + ' min. We\'ll buzz you.'); FK.haptic([10, 30, 10]); }; });
      setTimeout(function () { FK.scrollTo(el, 160); }, 150);
    });
  }
  // Read what you typed: a number sets the calories, words pick the kind of meal
  function parse(txt) {
    var num = /(\d{3,4})/.exec(txt.replace(',', '')), kc = num ? Math.max(300, Math.min(1500, +num[1])) : LEFT;
    var t = txt.toLowerCase(), q = /cheap|budget|\$|save/.test(t) ? 'cheap' : /flavou?r|spicy|tasty|treat/.test(t) ? 'flavour' : /something else|another/.test(t) ? Q : 'easy';
    return { kc: kc, q: q };
  }
  function ask(txt, kc, q) {
    Q = q; document.querySelectorAll('.asks .chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.q === q)); });
    var me = addBubble('bub me', txt); FK.scrollTo(me, 500);
    var m = pick(kc, q);
    aiSays('<b>' + m.n + '</b> lands right on your number: <b>' + m.k + ' of ' + kc + ' kcal</b>, with ' + m.p + 'g protein. Ready in ' + m.t + ' min.', function () {
      var c = card(m, kc); setTimeout(function () { FK.scrollTo(c, 200); }, 100);
    });
  }
  var bar = FK.askbar({ placeholder: 'Tell Forkout AI what you want…', onSend: function (txt) { var p = parse(txt); ask(txt, p.kc, p.q); } });
  var LEFT = 958; // the app already knows what's left today
  document.querySelectorAll('.asks .chip').forEach(function (b) {
    b.onclick = function () { bar.type(QTXT[b.dataset.q], 22); };
  });
  // Greeting
  addBubble('aihead', '<span class="aiorb"></span>Forkout AI');
  var hello = addBubble('bub ai', 'Hey Parker. You\'ve got <b>958 kcal</b> and <b>38g protein</b> left today. Tell me what you feel like and I\'ll find a dinner that fits.');

  // ---------- Live mode: real Forkout AI meal ideas (demo mode keeps the built-in meals above) ----------
  if (FK.api && FK.api.live) {
    var busy = false;
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    FK.api.chatContext().then(function (c) {
      LEFT = Math.max(0, (c.kcal_goal || 0) - (c.kcal_eaten || 0));
      var pl = Math.max(0, (c.protein_goal || 0) - (c.protein_eaten || 0));
      hello.innerHTML = 'Hey' + (c.name ? ' ' + esc(c.name.split(' ')[0]) : '') + '. You\'ve got <b>' + LEFT.toLocaleString('en-AU') + ' kcal</b> and <b>' + pl + 'g protein</b> left today. Tell me what you feel like and I\'ll find a meal that fits.';
    }).catch(function () {});
    FK.api.chatHistory('food', 12).catch(function () {}); // so "something else" knows what it already suggested
    function slotNow() { var h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snack'; }
    // The AI's meal in the shape this screen's card + recipe use. Every word is escaped first,
    // because card() and recipe() build HTML from these (the AI's text must never become code).
    function shape(m) {
      return { raw: m, n: esc(m.name), t: m.minutes, k: m.kcal, p: m.protein, c: m.carbs, f: m.fat, x: 1, cost: m.cost_aud ? 'A$' + m.cost_aud.toFixed(2) : '',
        ing: esc(m.ingredients.map(function (i) { return i.item; }).join(', ')), r: m.ingredients.map(function (i) { return [esc(i.item), esc(i.amount)]; }), s: m.steps.map(function (s) { return [esc(s.text), s.timer_min]; }) };
    }
    ask = function (txt, kc, q) {
      if (busy) return; busy = true;
      Q = q; document.querySelectorAll('.asks .chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.q === q)); });
      var me = addBubble('bub me', ''); me.textContent = txt; FK.scrollTo(me, 500);
      var t = addBubble('typing', '<i></i><i></i><i></i>'); FK.scrollTo(t, 700);
      FK.api.chat('food', txt).then(function (r) {
        t.remove(); addBubble('aihead', '<span class="aiorb"></span>Forkout AI'); addBubble('bub ai', FK.api.fmt(r.reply));
        if (!r.meal) return;
        var m = shape(r.meal), el = card(m, LEFT);
        var add = el.querySelector('[data-act=add]'); add.textContent = 'Add to ' + slotNow().toLowerCase();
        add.onclick = function () {
          var b = this; b.disabled = true;
          FK.store.addMeal({ name: m.raw.name, kcal: m.k, protein: m.p, carbs: m.c, fat: m.f, slot: slotNow(), source: 'ai', items: m.raw.ingredients.map(function (i) { return { name: i.item + ' (' + i.amount + ')' }; }) })
            .then(function () { b.textContent = 'Added ✓'; FK.burst(512, 1500); toast(m.raw.name + ' added'); try { FKPlan.logMeal(); } catch (e) {} LEFT = Math.max(0, LEFT - m.k); },
              function (e) { b.disabled = false; toast(e.message || 'Couldn’t add it. Try again.'); });
        };
        setTimeout(function () { FK.scrollTo(el, 200); }, 100);
      }, function (e) {
        t.remove(); var b = addBubble('bub ai', ''); b.textContent = e.message || 'Something went wrong. Try again.';
      }).then(function () { busy = false; });
    };
  }

  FK.ready();
})();
</script>
</body>
</html>
