<html lang="en">
<head>

<script>try{var q=/[?&]theme=(light|dark)/.exec(location.search),t=q?q[1]:localStorage.getItem('fk-look');if(!t)t='dark';if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='light')document.documentElement.dataset.fk='light'}catch(e){}</script>

<body data-tab="nutrition" data-title="Nutrition" data-note="Tap a day to see past meals. Swipe left or right to move between days.">
<div class="stage">
  <div class="device">
    <div class="app" id="app">
      <div class="scroll"><div class="canvas v5" id="canvas">
        <div class="top in" style="--i:0"><h1 class="ttl">Nutrition</h1><span class="ibtn press" data-toast="Food search comes next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg></span></div>
        <div class="weekstrip in" style="--i:1" id="week"></div>
        <div class="hist" id="hist" hidden><div><b id="histT">Wed 4 Nov</b><span>Past day · view only</span></div><button class="pillbtn press" id="toToday">Back to today</button></div>
        <section class="c in" style="--i:2" id="sumcard">
          <div class="bigk"><b class="num" id="left">958</b><span id="leftU">kcal left</span><em id="chip" hidden></em></div>
          <div class="cal2"><i id="cb"></i></div>
          <div class="sub2 num" id="sub">1,842 eaten of 2,800</div>
          <div class="m3">
            <div class="p"><div class="h"><svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="6.200" fill="currentColor"/><path d="M10.600 13.400 5.200 18.800" stroke-width="2.600"/><circle cx="4.200" cy="17.400" r="1.900" fill="currentColor" stroke="none"/><circle cx="6.600" cy="19.800" r="1.900" fill="currentColor" stroke="none"/></g></svg>Protein</div><b class="num"><span id="mP">142</span><small>/ 180g</small></b><div class="mb"><i id="bP"></i></div></div>
            <div class="c2"><div class="h"><svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.500V9" stroke-width="2"/><path d="M12 2c1.700 1.600 2.200 3.200 0 5.500C9.800 5.200 10.300 3.600 12 2z" fill="currentColor" stroke="none"/><path d="M12 9.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 9.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/><path d="M12 15c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 15c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/><path d="M12 20.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 20.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z" fill="currentColor" stroke="none"/></g></svg>Carbs</div><b class="num"><span id="mC">168</span><small>/ 350g</small></b><div class="mb"><i id="bC"></i></div></div>
            <div class="f"><div class="h"><svg class="bd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor" fill-opacity=".18"/><g transform="translate(8 8)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.600c3 0 4.600 3.200 4.600 6.200 0 1.600 1 2.800 1.900 4.300 1.600 2.700.8 5.200-1.300 6.700-1.600 1.200-3.300 1.700-5.200 1.700s-3.600-.5-5.200-1.700c-2.100-1.500-2.900-4-1.300-6.700.9-1.500 1.900-2.700 1.900-4.300 0-3 1.600-6.200 4.600-6.200z" stroke-width="2"/><circle cx="12" cy="15" r="3.200" fill="currentColor" stroke="none"/></g></svg>Fats</div><b class="num"><span id="mF">58</span><small>/ 90g</small></b><div class="mb"><i id="bF"></i></div></div>
          </div>
        </section>
        <div class="btnrow in" style="--i:3" id="acts"><a class="btn press" href="scan.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.500"/><path d="M8.500 6l1.200-2h4.600l1.200 2"/></svg>Snap meal</a><a class="btn dark press" href="meals.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>Meal ideas</a></div>
        <div class="sec in" style="--i:4"><h3 id="mealsT">Today's meals</h3></div>
        <div id="meals"></div>
      </div></div>
      <div class="layer top" id="topLayer"></div>
      <div class="layer bottom" id="bottomLayer"></div>
    </div>
  </div>
  <aside class="panel"></aside>
</div>
<script src="js/fk.js"></script>
<script src="js/plan.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/workouts.js"></script>
<script src="js/sync.js"></script>
<script>
(function () {
  var $ = FK.$;
  var DATA = {"M": {"yog": ["yoghurt.jpg", "Greek yoghurt and berries", "Greek yoghurt", 260, 24, 28, 5], "smo": ["smoothie.jpg", "Berry protein smoothie", "Protein smoothie", 240, 30, 22, 4], "tuna": ["tunawrap.jpg", "Tuna wrap and side salad", "Tuna wrap", 420, 32, 44, 12], "bar": ["proteinbar.jpg", "Protein bar and latte", "Protein bar & latte", 280, 20, 30, 9], "bowl": ["meal.jpg", "Chicken, rice and avocado bowl", "Chicken bowl", 642, 36, 44, 28], "stir": ["stirfry.jpg", "Beef stir-fry", "Beef stir-fry", 720, 48, 62, 22]}, "D": [{"d": "M", "n": 2, "name": "Mon 2 Nov", "m": [["yog", "8:05am"], ["smo", "10:20am"], ["bowl", "12:40pm"], ["bar", "3:30pm"], ["stir", "7:15pm"]]}, {"d": "T", "n": 3, "name": "Tue 3 Nov", "m": [["yog", "8:15am"], ["tuna", "12:30pm"], ["bowl", "3:00pm"], ["bar", "4:45pm"], ["stir", "7:30pm"]]}, {"d": "W", "n": 4, "name": "Wed 4 Nov", "m": [["yog", "7:50am"], ["smo", "10:00am"], ["tuna", "12:45pm"], ["bowl", "3:15pm"], ["bar", "5:00pm"], ["stir", "7:40pm"]]}, {"d": "T", "n": 5, "name": "Today", "m": [["yog", "8:10am"], ["smo", "10:30am"], ["tuna", "12:45pm"], ["bar", "3:15pm"], ["bowl", "6:30pm"]]}, {"d": "F", "n": 6, "name": "Fri 6 Nov", "m": []}, {"d": "S", "n": 7, "name": "Sat 7 Nov", "m": []}, {"d": "S", "n": 8, "name": "Sun 8 Nov", "m": []}], "ICON": {"flame": "<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2.5c1.2 4.2 5.8 5.6 5.8 11a5.8 5.8 0 0 1-11.6 0c0-3.4 2.2-4.6 2.3-7 1 1.2 2.1 2.2 3.300 2.300-.4-2.200-.6-4.300.2-6.300z\"/></svg>", "p": "<svg class=\"bd\" viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"currentColor\" fill-opacity=\".18\"/><g transform=\"translate(8 8)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"15\" cy=\"9\" r=\"6.200\" fill=\"currentColor\"/><path d=\"M10.600 13.400 5.200 18.800\" stroke-width=\"2.600\"/><circle cx=\"4.200\" cy=\"17.400\" r=\"1.900\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"6.600\" cy=\"19.800\" r=\"1.900\" fill=\"currentColor\" stroke=\"none\"/></g></svg>", "c": "<svg class=\"bd\" viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"currentColor\" fill-opacity=\".18\"/><g transform=\"translate(8 8)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21.500V9\" stroke-width=\"2\"/><path d=\"M12 2c1.700 1.600 2.200 3.200 0 5.500C9.800 5.200 10.300 3.600 12 2z\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M12 9.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 9.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M12 15c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 15c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M12 20.500c-3 0-4.800-1.800-4.800-4.800 3 0 4.800 1.800 4.800 4.800zM12 20.500c3 0 4.800-1.800 4.800-4.800-3 0-4.800 1.800-4.800 4.800z\" fill=\"currentColor\" stroke=\"none\"/></g></svg>", "f": "<svg class=\"bd\" viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"currentColor\" fill-opacity=\".18\"/><g transform=\"translate(8 8)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2.600c3 0 4.600 3.200 4.600 6.200 0 1.600 1 2.800 1.900 4.300 1.600 2.700.8 5.200-1.300 6.700-1.600 1.200-3.300 1.700-5.200 1.700s-3.600-.5-5.200-1.700c-2.100-1.500-2.900-4-1.300-6.700.9-1.500 1.900-2.700 1.900-4.300 0-3 1.600-6.200 4.600-6.200z\" stroke-width=\"2\"/><circle cx=\"12\" cy=\"15\" r=\"3.200\" fill=\"currentColor\" stroke=\"none\"/></g></svg>"}};
  var TODAY = 3, sel = TODAY, GOAL = {k: 2800, p: 180, c: 350, f: 90};
  var fmt = function (n) { return n.toLocaleString('en-AU'); };
  document.querySelectorAll('[data-toast]').forEach(function (a) { a.addEventListener('click', function () { FK.toast(a.dataset.toast); }); });
  function strip() {
    $('week').innerHTML = DATA.D.map(function (d, i) {
      var cls = (i === sel ? 'sel ' : '') + (i === TODAY ? 't ' : '') + (i > TODAY ? 'f' : '');
      return '<button class="' + cls + '" data-i="' + i + '"' + (i > TODAY ? ' disabled' : '') + '>' + d.d + '<i>' + d.n + '</i></button>';
    }).join('');
  }
  function meal(m, time, live) {
    var x = DATA.M[m], real = !x[0], tag = live && !real ? 'a' : 'div', href = live && !real ? ' href="scan.html"' : '';
    return '<' + tag + ' class="mr' + (live ? ' press' : ' past') + '"' + href + (real && live ? ' data-id="' + m + '" role="button"' : '') + '>' + (real ? '<span class="mph" style="display:grid;place-items:center;flex:none;width:120px;height:120px;border-radius:28px;background:rgba(var(--ink),.06);color:var(--muted)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:48px;height:48px"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></svg></span>' : '<img src="photos/' + x[0] + '" alt="' + x[1] + '">') + '<div class="mt"><div class="mtop"><b>' + x[2] + '</b><span class="mtime">' + time + '</span></div><div class="mk num">' + DATA.ICON.flame + x[3] + '<small>kcal</small></div><div class="mm num"><span class="p">' + DATA.ICON.p + x[4] + 'g</span><span class="cc">' + DATA.ICON.c + x[5] + 'g</span><span class="f">' + DATA.ICON.f + x[6] + 'g</span></div></div></' + tag + '>';
  }
  function render(anim) {
    var d = DATA.D[sel], live = sel === TODAY, past = !live;
    var t = { k: 0, p: 0, c: 0, f: 0 };
    d.m.forEach(function (r) { var x = DATA.M[r[0]]; t.k += x[3]; t.p += x[4]; t.c += x[5]; t.f += x[6]; });
    strip();
    $('hist').hidden = live; $('acts').hidden = !live; $('sumcard').classList.toggle('past', past);
    $('histT').textContent = d.name;
    var empty = !d.m.length;
    if (live) { $('left').textContent = fmt(GOAL.k - t.k); $('leftU').textContent = 'kcal left'; $('sub').textContent = fmt(t.k) + ' eaten of ' + fmt(GOAL.k); }
    else { $('left').textContent = empty ? '–' : fmt(t.k); $('leftU').textContent = empty ? 'nothing logged' : 'kcal eaten'; $('sub').textContent = 'Target ' + fmt(GOAL.k) + ' kcal'; }
    var chip = $('chip'); chip.hidden = !(past && !empty);
    if (!chip.hidden) { var df = t.k - GOAL.k; chip.textContent = Math.abs(df) <= 140 ? 'On target' : df > 0 ? 'Over by ' + fmt(df) : 'Under by ' + fmt(-df); chip.className = Math.abs(df) <= 140 ? 'ok' : 'warn'; }
    $('mP').textContent = t.p; $('mC').textContent = t.c; $('mF').textContent = t.f;
    $('mealsT').textContent = live ? "Today's meals" : empty ? 'Meals' : 'Meals logged';
    $('meals').innerHTML = d.m.length ? d.m.map(function (r) { return meal(r[0], r[1], live); }).join('') + (live ? '<a class="mr add press" href="scan.html" style="justify-content:center;border:2px dashed color-mix(in srgb,var(--acc) 40%,transparent);background:none"><b style="font-size:32px;color:var(--acc)">+ Add meal</b></a>' : '') : '<div class="nothing">Nothing logged for this day.</div>';
    setTimeout(function () {
      $('cb').style.width = Math.min(100, t.k / GOAL.k * 100) + '%';
      $('bP').style.width = Math.min(100, t.p / GOAL.p * 100) + '%'; $('bC').style.width = Math.min(100, t.c / GOAL.c * 100) + '%'; $('bF').style.width = Math.min(100, t.f / GOAL.f * 100) + '%';
    }, anim ? 350 : 30);
  }
  $('week').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || b.disabled) return; sel = +b.dataset.i; FK.haptic(8); render(); });
  $('toToday').addEventListener('click', function () { sel = TODAY; render(); });
  var x0 = null;
  $('canvas').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $('canvas').addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) < 70) return; var n = sel + (dx < 0 ? 1 : -1); if (n >= 0 && n <= TODAY) { sel = n; render(); } }, { passive: true });
  // LIVE: this week from your account. Days load when you tap them; tap one of today's meals to remove it.
  if (FK.db && FK.db.live) {
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var P = FKPlan.get(), MX = FKPlan.macros(P); GOAL = { k: P.kcal, p: MX.p, c: MX.c, f: MX.f };
    ['mP', 'mC', 'mF'].forEach(function (id, i) { $(id).nextElementSibling.textContent = '/ ' + [MX.p, MX.c, MX.f][i] + 'g'; });
    var mon = new Date(); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7);
    TODAY = sel = (new Date().getDay() + 6) % 7; DATA.M = {};
    DATA.D = [0, 1, 2, 3, 4, 5, 6].map(function (i) {
      var d = new Date(mon); d.setDate(mon.getDate() + i);
      return { d: 'MTWTFSS'[i], n: d.getDate(), day: FK.store.day(d), name: i === TODAY ? 'Today' : d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }), m: [] };
    });
    var loaded = {}, oldRender = render;
    render = function (anim) {
      var D = DATA.D[sel]; oldRender(anim);
      if (loaded[sel] || sel > TODAY) return;
      loaded[sel] = true; var s = sel;
      FK.store.meals(D.day).then(function (list) {
        D.m = list.map(function (x) {
          DATA.M[x.id] = [null, '', esc(x.name), Math.round(x.kcal), Math.round(x.protein), Math.round(x.carbs), Math.round(x.fat)];
          return [x.id, new Date(x.eaten_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase()];
        });
        if (sel === s) oldRender(false);
      }, function (e) { loaded[s] = false; FK.toast(FK.db.friendly ? FK.db.friendly(e) : 'Could not load meals'); });
    };
    $('meals').addEventListener('click', function (e) {
      var r = e.target.closest('[data-id]'); if (!r || sel !== TODAY) return;
      var id = r.dataset.id; if (!confirm('Remove ' + DATA.M[id][2].replace(/&amp;/g, '&') + ' from today?')) return;
      FK.store.removeMeal(id).then(function () { var D = DATA.D[TODAY]; D.m = D.m.filter(function (x) { return x[0] !== id; }); render(); FK.toast('Meal removed'); }, function (e) { FK.toast(FK.db.friendly(e)); });
    });
  }
  render(true);

  FK.ready();
})();
</script>
</body>
</html>
